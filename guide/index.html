<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide du séjour | Les Terrasses de Lumbarda</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/svg+xml" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A96E;--gold-dark:#b8944f;--dark:#1a1a1a;--dark-bg:#111;--gray:#666;--gray-light:#999;--bg-light:#FAF9F7;--border:rgba(0,0,0,.07);--radius:12px}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;font-weight:300;color:var(--dark);background:var(--bg-light);line-height:1.7;min-height:100vh}
a{color:var(--gold-dark);text-decoration:none}
.logo{width:64px;height:64px;background:var(--gold);-webkit-mask:url('../images/logo-nav.svg') center/contain no-repeat;mask:url('../images/logo-nav.svg') center/contain no-repeat;margin:0 auto}
/* ---- language screen ---- */
#langScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--dark-bg);color:#fff;padding:40px 24px;text-align:center}
#langScreen .brand{font-family:'Playfair Display',serif;font-style:italic;font-size:1.6rem;margin:22px 0 4px}
#langScreen .sub{font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:40px}
.lang-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.lang-list button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 22px;border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);background:rgba(255,255,255,.04);color:#fff;font-family:inherit;font-size:1rem;font-weight:400;cursor:pointer;transition:.2s}
.lang-list button:hover,.lang-list button:focus{border-color:var(--gold);background:rgba(201,169,110,.12);outline:none}
.lang-list small{font-size:.7rem;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
/* ---- guide ---- */
#guide{display:none}
#guide.active{display:block}
#langScreen.hidden{display:none}
header{background:var(--dark-bg);color:#fff;padding:28px 20px 24px;text-align:center;position:relative}
header .logo{width:48px;height:48px}
header h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:1.5rem;margin-top:12px}
header p{font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-top:4px}
.lang-switch{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:20px;padding:6px 12px;font-size:.72rem;letter-spacing:1px;cursor:pointer;font-family:inherit}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.welcome{background:#fff;border-radius:var(--radius);padding:22px 22px;border-left:3px solid var(--gold);margin-bottom:18px;font-size:.95rem}
.toc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:24px}
.toc a{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:.84rem;color:var(--dark);font-weight:400}
.toc svg,.card h2 svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.card{background:#fff;border-radius:var(--radius);padding:22px;margin-bottom:14px;border:1px solid var(--border);scroll-margin-top:16px}
.card h2{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:1.25rem;margin-bottom:12px}
.card p,.card li{font-size:.92rem;color:#333;margin-bottom:8px}
.card ul{padding-left:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--bg-light);border-radius:8px;padding:12px 14px;margin:10px 0;font-size:.9rem}
.kv b{font-weight:500;color:var(--gold-dark);white-space:nowrap}
.kv code{font-family:ui-monospace,Consolas,monospace;font-size:.95rem;background:#fff;padding:2px 8px;border-radius:5px;border:1px solid var(--border);user-select:all}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#fff;padding:11px 20px;border-radius:30px;font-size:.8rem;letter-spacing:.8px;text-transform:uppercase;font-weight:500;margin:6px 8px 0 0}
.btn.dark{background:var(--dark)}
.emergency{background:#1a1a1a;color:#fff;border:none}
.emergency h2,.emergency p,.emergency li{color:#fff}
.emergency .kv{background:rgba(255,255,255,.06)}
.emergency .kv b{color:var(--gold)}
.emergency a{color:var(--gold)}
footer{text-align:center;font-size:.75rem;color:var(--gray-light);padding:10px 16px 30px}
@media(max-width:420px){.toc{grid-template-columns:1fr}}
@media print{#langScreen,.lang-switch,.toc{display:none}.card{break-inside:avoid;border:1px solid #ddd}}
</style>
</head>
<body>

<div id="langScreen">
  <div class="logo"></div>
  <div class="brand">Les Terrasses de Lumbarda</div>
  <div class="sub">Guide du séjour · Guest guide</div>
  <div class="lang-list">
    <button data-lang="fr">Français <small>FR</small></button>
    <button data-lang="en">English <small>EN</small></button>
    <button data-lang="it">Italiano <small>IT</small></button>
    <button data-lang="de">Deutsch <small>DE</small></button>
    <button data-lang="hr">Hrvatski <small>HR</small></button>
  </div>
</div>

<div id="guide">
  <header>
    <button class="lang-switch" id="switchLang">FR · EN · IT · DE · HR</button>
    <div class="logo"></div>
    <h1>Les Terrasses de Lumbarda</h1>
    <p id="hSub"></p>
  </header>
  <div class="wrap">
    <div class="welcome" id="welcome"></div>
    <nav class="toc" id="toc"></nav>
    <div id="cards"></div>
  </div>
  <footer><a href="https://lesterrasses-lumbarda.com">lesterrasses-lumbarda.com</a></footer>
</div>

<script src="guide-config.js"></script>
<script>
var I={
 wifi:'<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/>',
 tv:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
 ac:'<path d="M2 7h20M2 12h20M2 17h20"/><path d="M6 7v10M18 7v10"/>',
 kitchen:'<path d="M3 3h18v18H3z"/><path d="M3 12h18M8 3v9M16 12v9"/>',
 bath:'<path d="M4 12h16M4 12a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4M6 12V5a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v1"/>',
 pool:'<path d="M2 16c2-4 4-6 10-6s8 2 10 6"/><path d="M7 16c1-2 2.5-3 5-3s4 1 5 3"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4M18 5l2 2M15 8l2 2"/>',
 rules:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
 around:'<circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20M2 12h20"/>',
 travel:'<path d="M5 17h14M3 11l2-5h14l2 5v6H3z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
 sos:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4M12 16h.01"/>',
 phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/>'
};
function svg(k){return '<svg viewBox="0 0 24 24">'+I[k]+'</svg>'}
var APT=(function(){var a=new URLSearchParams(location.search).get('apt');if(a&&GUIDE_CONFIG.WIFI[a])return a;try{var s=localStorage.getItem('lt_guide_apt');if(s&&GUIDE_CONFIG.WIFI[s])return s}catch(e){}return null})();
try{if(APT)localStorage.setItem('lt_guide_apt',APT)}catch(e){}
function val(k){if(k==='WIFI_NAME')return APT?GUIDE_CONFIG.WIFI[APT].name:'';if(k==='WIFI_PASSWORD')return APT?GUIDE_CONFIG.WIFI[APT].password:'';if(k==='APT')return APT||'';return GUIDE_CONFIG[k]}
function fill(s){return String(s).replace(/\{(\w+)\}/g,function(_,k){var v=val(k);return (v!==undefined&&v!=='')?v:'<em style="color:#b00">[…]</em>'})}
function render(lang){
  var d=GUIDE_TEXT[lang]||GUIDE_TEXT.fr;document.documentElement.lang=lang;
  document.getElementById('hSub').textContent=d.sub+(APT?' · '+(d.apt||'Appartement')+' '+APT:'');
  document.getElementById('welcome').innerHTML=fill(d.welcome);
  var toc='',cards='';
  d.sections.forEach(function(s){
    toc+='<a href="#'+s.id+'">'+svg(s.icon)+s.title+'</a>';
    cards+='<section class="card'+(s.id==='sos'?' emergency':'')+'" id="'+s.id+'"><h2>'+svg(s.icon)+s.title+'</h2>'+fill(s.html)+'</section>';
  });
  document.getElementById('toc').innerHTML=toc;document.getElementById('cards').innerHTML=cards;
  document.getElementById('langScreen').classList.add('hidden');document.getElementById('guide').classList.add('active');
  try{localStorage.setItem('lt_guide_lang',lang)}catch(e){}
  window.scrollTo(0,0);
}
document.querySelectorAll('.lang-list button').forEach(function(b){b.addEventListener('click',function(){render(b.getAttribute('data-lang'))})});
document.getElementById('switchLang').addEventListener('click',function(){document.getElementById('guide').classList.remove('active');document.getElementById('langScreen').classList.remove('hidden');window.scrollTo(0,0)});
(function(){var q=new URLSearchParams(location.search).get('lang');var s=null;try{s=localStorage.getItem('lt_guide_lang')}catch(e){};if(q&&GUIDE_TEXT[q])render(q);else if(s&&GUIDE_TEXT[s])render(s);})();
</script>
</body>
</html>
