name: Copier le site OVH vers GitHub

# Lecture seule côté OVH : télécharge le dossier www tel qu'il est en ligne
# et le range dans la branche "site-ovh" du dépôt. Rien n'est modifié sur OVH.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Télécharger www depuis OVH
        env:
          HOST: ${{ secrets.OVH_FTP_HOST }}
          USER: ${{ secrets.OVH_FTP_USER }}
          PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          mkdir -p /tmp/backup
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "set sftp:auto-confirm yes; set net:timeout 30; set net:max-retries 2; set cmd:fail-exit yes; mirror --verbose --exclude-glob .htpasswd www /tmp/backup/www; bye"
          ls -la /tmp/backup/www
      - name: Ranger dans la branche site-ovh
        run: |
          git config user.name "copie-ovh"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan site-ovh
          git rm -rfq . || true
          cp -a /tmp/backup/www/. .
          git add -A
          git commit -qm "Copie du dossier www d'OVH"
          git push -f origin site-ovh
