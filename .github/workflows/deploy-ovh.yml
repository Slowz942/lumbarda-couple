name: Déploiement OVH

# Chaque push sur "main" met le site en ligne automatiquement via SFTP (chiffré).
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   OVH_FTP_HOST      ex : ftp.cluster129.hosting.ovh.net
#   OVH_FTP_USER      identifiant FTP OVH (ex : lestern)
#   OVH_FTP_PASSWORD  mot de passe FTP OVH
#   OVH_FTP_DIR       dossier cible, généralement "www/"  (avec le / final)

# DÉPLOIEMENT AUTOMATIQUE SUSPENDU le 18/09/2026 : la bonne version du site
# est celle restaurée sur OVH. Ne relancer qu'après l'avoir intégrée au dépôt.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Préparer les fichiers à publier
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' \
                --exclude '*.md' --exclude '.gitignore' ./ /tmp/site/
          ls -la /tmp/site

      - name: Envoyer sur OVH (SFTP)
        env:
          HOST: ${{ secrets.OVH_FTP_HOST }}
          USER: ${{ secrets.OVH_FTP_USER }}
          PASS: ${{ secrets.OVH_FTP_PASSWORD }}
          DIR:  ${{ secrets.OVH_FTP_DIR }}
        run: |
          set -e
          [ -n "$HOST" ] || { echo "::error::Secret OVH_FTP_HOST manquant"; exit 1; }
          [ -n "$USER" ] || { echo "::error::Secret OVH_FTP_USER manquant"; exit 1; }
          [ -n "$PASS" ] || { echo "::error::Secret OVH_FTP_PASSWORD manquant"; exit 1; }
          DIR="${DIR:-www/}"
          echo "Connexion SFTP à $HOST en tant que $USER, dossier $DIR"
          lftp -u "$USER","$PASS" "sftp://$HOST" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 2
          set cmd:fail-exit yes
          lcd /tmp/site
          cd "$DIR"
          mirror --reverse --delete --verbose --no-perms --ignore-time . .
          echo "=== Contenu de $DIR après déploiement ==="
          ls -l
          bye
          EOF
          echo "Déploiement terminé."
